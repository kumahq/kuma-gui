delete:
  operationId: deleteZone
  summary: Deletes Zone entity
  parameters:
    - name: name
      in: path
      description: name of the Zone
      required: true
      schema:
        type: string
  responses:
    '200':
      $ref: '../components/responses/ZoneDeleteSuccessResponse.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
  tags:
    - Zone
get:
  operationId: getZone
  summary: Returns Zone entity
  parameters:
    - name: name
      in: path
      description: name of the Zone
      required: true
      schema:
        type: string
  responses:
    '200':
      $ref: '../components/responses/ZoneItem.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
  tags:
    - Zone
put:
  operationId: putZone
  summary: Creates or Updates Zone entity
  parameters:
    - name: name
      in: path
      description: name of the Zone
      required: true
      schema:
        type: string
  requestBody:
    description: Put request
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ZoneItem.yaml'
  responses:
    '200':
      $ref: '../components/responses/ZoneCreateOrUpdateSuccessResponse.yaml'
    '201':
      $ref: '../components/responses/ZoneCreateOrUpdateSuccessResponse.yaml'
  tags:
    - Zone
