post:
  operationId: postGlobalSecretAlias
  summary: Creates GlobalSecret entity
  description: Creates a resource using the name in the body. An existing resource is never modified. Requires Kuma 3.0 or later.
  requestBody:
    description: Resource to create
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/GlobalSecretItem.yaml'
  responses:
    '201':
      $ref: '../components/responses/GlobalSecretCreateOrUpdateSuccessResponse.yaml'
    '400':
      description: Invalid resource
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '409':
      description: A resource with this identity already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
  tags:
    - GlobalSecret
get:
  operationId: getGlobalSecretListAlias
  summary: Returns a list of GlobalSecret entities.
  parameters:
    - name: offset
      in: query
      description: offset in the list of entities
      required: false
      schema:
        type: integer
        example: 0
    - name: size
      in: query
      description: the number of items per page
      required: false
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
  responses:
    '200':
      $ref: '../components/responses/GlobalSecretList.yaml'
  tags:
    - GlobalSecret
