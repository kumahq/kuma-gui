      in: path
      description: The name of the zone to get the overview for.
      required: true
      schema:
        type: string
  responses:
    '200':
      $ref: '../components/responses/GetZoneOverviewResponse.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '500':
      $ref: '../components/responses/Internal.yaml'
