post:
  operationId: postMeshTimeout
  summary: Creates MeshTimeout entity
  description: Creates a resource using the name in the body. An existing resource is never modified. Requires Kuma 3.0 or later.
  parameters:
    - name: mesh
      in: path
      description: name of the mesh
      required: true
      schema:
        type: string
  requestBody:
    description: Resource to create
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/MeshTimeoutItem.yaml'
  responses:
    '201':
      $ref: '../components/responses/MeshTimeoutCreateOrUpdateSuccessResponse.yaml'
    '400':
      description: Invalid resource
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '404':
      description: Parent mesh not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/NotFoundError.yaml'
    '409':
      description: A resource with this identity already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
  tags:
    - MeshTimeout
get:
  operationId: getMeshTimeoutList
  summary: Returns a list of MeshTimeout in the mesh.
  parameters:
    - name: offset
      in: query
      description: offset in the list of entities
      required: false
      schema:
        type: integer
      example: 0
    - name: size
      in: query
      description: the number of items per page
      required: false
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    - name: filter
      in: query
      description: filter by labels when multiple filters are present, they are ANDed
      required: false
      schema:
        type: object
        properties:
          key:
            type: string
          value:
            type: string
      example:
        label.k8s.kuma.io/namespace: my-ns
    - name: mesh
      in: path
      description: name of the mesh
      required: true
      schema:
        type: string
  responses:
    '200':
      $ref: '../components/responses/MeshTimeoutList.yaml'
  tags:
    - MeshTimeout
