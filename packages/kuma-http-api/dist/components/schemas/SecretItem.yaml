type: object
properties:
  creationTime:
    description: Time at which the resource was created
    type: string
    format: date-time
    readOnly: true
  data:
    description: Value of the secret
    type: string
    format: byte
  labels:
    type: object
    additionalProperties:
      type: string
  mesh:
    type: string
    maxLength: 253
    pattern: ^[0-9a-z-_.]*$
  modificationTime:
    description: Time at which the resource was updated
    type: string
    format: date-time
    readOnly: true
  name:
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  type:
    type: string
required:
  - type
  - name
  - mesh
