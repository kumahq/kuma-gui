description: |-
  NOTICE: This policy defines its own `GetDefault` method so that it can have the given
  structure for deserialization but still use the generic policy merging
  machinery.
  //
  MeshTCPRoute configures routing for TCP traffic between services in the mesh. It enables traffic splitting and weighted load balancing across different backend endpoints, useful for canary deployments, blue-green deployments, and gradual traffic migration for TCP-based services.
type: object
properties:
  type:
    description: the type of the resource
    type: string
    enum:
      - MeshTCPRoute
  mesh:
    description: Mesh is the name of the Kuma mesh this resource belongs to. It may be omitted for cluster-scoped resources.
    type: string
    default: default
    maxLength: 253
    pattern: ^[0-9a-z-_.]*$
  kri:
    description: A unique identifier for this resource instance used by internal tooling and integrations. Typically derived from resource attributes and may be used for cross-references or indexing
    type: string
    example: kri_mtcpr_default_zone-east_kuma-demo_mypolicy1_
    readOnly: true
  name:
    description: Name of the Kuma resource
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  labels:
    description: The labels to help identity resources
    type: object
    additionalProperties:
      type: string
  spec:
    description: Spec is the specification of the Kuma MeshTCPRoute resource.
    type: object
    properties:
      targetRef:
        description: |-
          TargetRef is a reference to the resource the policy takes an effect on.
          The resource could be either a real store object or virtual resource
          defined in-place.
        type: object
        properties:
          kind:
            description: Kind of the referenced resource
            type: string
            enum:
              - Mesh
              - Dataplane
          labels:
            description: |-
              Labels are used to select referenced real resources and to carry legacy
              service identity when a common TargetRef must still target old
              service-tag based paths.
            type: object
            additionalProperties:
              type: string
          sectionName:
            description: |-
              SectionName is used to target specific section of resource.
              For example, you can target port from MeshService.ports[] by its name. Only traffic to this port will be affected.
            type: string
        required:
          - kind
      to:
        description: |-
          To list makes a match between the consumed services and corresponding
          configurations
        type: array
        items:
          properties:
            rules:
              description: |-
                Rules contains the routing rules applies to a combination of top-level
                targetRef and the targetRef in this entry.
              type: array
              items:
                properties:
                  default:
                    description: |-
                      Default holds routing rules that can be merged with rules from other
                      policies.
                    type: object
                    properties:
                      backendRefs:
                        type: array
                        items:
                          description: BackendRef defines the destination traffic is routed to.
                          properties:
                            kind:
                              description: Kind of the referenced resource
                              type: string
                              enum:
                                - MeshService
                                - MeshExternalService
                                - MeshMultiZoneService
                            labels:
                              description: Labels are used to select the referenced real resource.
                              type: object
                              additionalProperties:
                                type: string
                            port:
                              description: Port is only supported when this ref refers to a real MeshService object
                              type: integer
                              format: int32
                            sectionName:
                              description: |-
                                SectionName is used to target a specific section of the resource.
                                For example, you can target a port from MeshService.ports[] by its name.
                              type: string
                            weight:
                              type: integer
                              maximum: 4294967295
                              minimum: 0
                          required:
                            - kind
                          type: object
                required:
                  - default
                type: object
              maxItems: 1
            targetRef:
              description: |-
                TargetRef is a reference to the resource that represents a group of
                destinations.
              type: object
              properties:
                kind:
                  description: Kind of the referenced resource
                  type: string
                  enum:
                    - Mesh
                    - MeshService
                    - MeshExternalService
                    - MeshMultiZoneService
                    - MeshHTTPRoute
                labels:
                  description: |-
                    Labels are used to select referenced real resources and to carry legacy
                    service identity when a common TargetRef must still target old
                    service-tag based paths.
                  type: object
                  additionalProperties:
                    type: string
                sectionName:
                  description: |-
                    SectionName is used to target specific section of resource.
                    For example, you can target port from MeshService.ports[] by its name. Only traffic to this port will be affected.
                  type: string
              required:
                - kind
          required:
            - rules
            - targetRef
          type: object
        minItems: 1
  creationTime:
    description: Time at which the resource was created
    type: string
    format: date-time
    example: 1901-01-01T00:00:00.000Z
    readOnly: true
  modificationTime:
    description: Time at which the resource was updated
    type: string
    format: date-time
    example: 1901-01-01T00:00:00.000Z
    readOnly: true
required:
  - type
  - name
  - spec
