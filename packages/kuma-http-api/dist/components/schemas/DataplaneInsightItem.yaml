type: object
properties:
  creationTime:
    description: Time at which the resource was created
    type: string
    format: date-time
    readOnly: true
  labels:
    type: object
    additionalProperties:
      type: string
  mTLS:
    description: Insights about mTLS for Dataplane.
    type: object
    properties:
      certificateExpirationTime:
        description: |-
          Expiration time of the last certificate that was generated for a
          Dataplane.
        type: string
        format: date-time
      certificateRegenerations:
        description: Number of certificate regenerations for a Dataplane.
        type: integer
      issuedBackend:
        description: Backend that was used to generate current certificate
        type: string
      lastCertificateRegeneration:
        description: Time on which the last certificate was generated.
        type: string
        format: date-time
      supportedBackends:
        description: Supported backends (CA).
        type: array
        items:
          type: string
  mesh:
    type: string
    maxLength: 253
    pattern: ^[0-9a-z-_.]*$
  metadata:
    type: object
    properties: {}
  modificationTime:
    description: Time at which the resource was updated
    type: string
    format: date-time
    readOnly: true
  name:
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  openTelemetry:
    description: Insights about OTel runtime resolution for this Dataplane.
    type: object
    properties:
      backends:
        type: array
        items:
          properties:
            logs:
              type: object
              properties:
                blockedReasons:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                envAllowed:
                  type: boolean
                envInputPresent:
                  type: boolean
                missingFields:
                  type: array
                  items:
                    type: string
                overrideKinds:
                  type: array
                  items:
                    type: string
                state:
                  type: string
            metrics:
              type: object
              properties:
                blockedReasons:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                envAllowed:
                  type: boolean
                envInputPresent:
                  type: boolean
                missingFields:
                  type: array
                  items:
                    type: string
                overrideKinds:
                  type: array
                  items:
                    type: string
                state:
                  type: string
            name:
              type: string
            traces:
              type: object
              properties:
                blockedReasons:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                envAllowed:
                  type: boolean
                envInputPresent:
                  type: boolean
                missingFields:
                  type: array
                  items:
                    type: string
                overrideKinds:
                  type: array
                  items:
                    type: string
                state:
                  type: string
          type: object
  subscriptions:
    description: List of ADS subscriptions created by a given Dataplane.
    type: array
    items:
      description: DiscoverySubscription describes a single ADS subscription created by a Dataplane to the Control Plane.
      properties:
        connectTime:
          description: Time when a given Dataplane connected to the Control Plane.
          type: string
          format: date-time
        controlPlaneInstanceId:
          description: Control Plane instance that handled given subscription.
          type: string
        disconnectTime:
          description: Time when a given Dataplane disconnected from the Control Plane.
          type: string
          format: date-time
        generation:
          description: |-
            Generation is an integer number which is periodically increased by the
            status sink
          type: integer
        id:
          description: Unique id per ADS subscription.
          type: string
        status:
          description: Status of the ADS subscription.
          type: object
          properties:
            cds:
              description: CDS defines all CDS stats.
              type: object
              properties:
                responsesAcknowledged:
                  description: Number of xDS responses ACKed by the Dataplane.
                  type: integer
                responsesRejected:
                  description: Number of xDS responses NACKed by the Dataplane.
                  type: integer
                responsesSent:
                  description: Number of xDS responses sent to the Dataplane.
                  type: integer
            eds:
              description: EDS defines all EDS stats.
              type: object
              properties:
                responsesAcknowledged:
                  description: Number of xDS responses ACKed by the Dataplane.
                  type: integer
                responsesRejected:
                  description: Number of xDS responses NACKed by the Dataplane.
                  type: integer
                responsesSent:
                  description: Number of xDS responses sent to the Dataplane.
                  type: integer
            lastUpdateTime:
              description: Time when status of a given ADS subscription was most recently updated.
              type: string
              format: date-time
            lds:
              description: LDS defines all LDS stats.
              type: object
              properties:
                responsesAcknowledged:
                  description: Number of xDS responses ACKed by the Dataplane.
                  type: integer
                responsesRejected:
                  description: Number of xDS responses NACKed by the Dataplane.
                  type: integer
                responsesSent:
                  description: Number of xDS responses sent to the Dataplane.
                  type: integer
            rds:
              description: RDS defines all RDS stats.
              type: object
              properties:
                responsesAcknowledged:
                  description: Number of xDS responses ACKed by the Dataplane.
                  type: integer
                responsesRejected:
                  description: Number of xDS responses NACKed by the Dataplane.
                  type: integer
                responsesSent:
                  description: Number of xDS responses sent to the Dataplane.
                  type: integer
            total:
              description: Total defines an aggregate over individual xDS stats.
              type: object
              properties:
                responsesAcknowledged:
                  description: Number of xDS responses ACKed by the Dataplane.
                  type: integer
                responsesRejected:
                  description: Number of xDS responses NACKed by the Dataplane.
                  type: integer
                responsesSent:
                  description: Number of xDS responses sent to the Dataplane.
                  type: integer
        version:
          description: Version of Envoy and Kuma dataplane
          type: object
          properties:
            dependencies:
              description: Versions of other dependencies
              type: object
              additionalProperties:
                type: string
            envoy:
              description: Version of Envoy
              type: object
              properties:
                build:
                  description: Full build tag of Envoy version
                  type: string
                kumaDpCompatible:
                  description: True iff Envoy version is compatible with Kuma DP version
                  type: boolean
                version:
                  description: Version number of Envoy
                  type: string
            kumaDp:
              description: Version of Kuma Dataplane
              type: object
              properties:
                buildDate:
                  description: Build date of Kuma Dataplane version
                  type: string
                gitCommit:
                  description: Git commit of Kuma Dataplane version
                  type: string
                gitTag:
                  description: Git tag of Kuma Dataplane version
                  type: string
                kumaCpCompatible:
                  description: True iff Kuma DP version is compatible with Kuma CP version
                  type: boolean
                version:
                  description: Version number of Kuma Dataplane
                  type: string
      type: object
  type:
    type: string
required:
  - type
  - name
  - mesh
