type: object
properties:
  type:
    description: the type of the policy
    type: string
    example: MeshRetry
  proxyRule:
    $ref: 'ProxyRule.yaml'
  toResourceRules:
    description: a set of rules for the outbounds produced by real resources (i.e MeshService, MeshExternalService, MeshMultiZoneService).
    type: array
    items:
      $ref: 'ResourceRule.yaml'
  inboundRules:
    description: a set of rules for each inbound port of the proxy.
    type: array
    items:
      $ref: 'InboundRulesEntry.yaml'
  warnings:
    description: a set of warnings to show in policy matching
    type: array
    items:
      type: string
    example:
      - Mesh is not Mtls enabled this policy will have no effect
required:
  - type
