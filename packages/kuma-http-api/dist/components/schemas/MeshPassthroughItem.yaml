description: MeshPassthrough controls how traffic to external services (outside the mesh) is handled by the sidecar proxy. It allows you to configure passthrough mode to permit, deny, or selectively allow traffic to specific external destinations based on domain names, IPs, or CIDR ranges.
type: object
properties:
  type:
    description: the type of the resource
    type: string
    enum:
      - MeshPassthrough
  mesh:
    description: Mesh is the name of the Kuma mesh this resource belongs to. It may be omitted for cluster-scoped resources.
    type: string
    default: default
    maxLength: 253
    pattern: ^[0-9a-z-_.]*$
  kri:
    description: A unique identifier for this resource instance used by internal tooling and integrations. Typically derived from resource attributes and may be used for cross-references or indexing
    type: string
    example: kri_mp_default_zone-east_kuma-demo_mypolicy1_
    readOnly: true
  name:
    description: Name of the Kuma resource
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  labels:
    description: The labels to help identity resources
    type: object
    additionalProperties:
      type: string
  spec:
    description: Spec is the specification of the Kuma MeshPassthrough resource.
    type: object
    properties:
      default:
        description: MeshPassthrough configuration.
        type: object
        properties:
          appendMatch:
            description: AppendMatch is a list of destinations that should be allowed through the sidecar.
            type: array
            items:
              properties:
                port:
                  description: |-
                    Port defines the port to which a user makes a request. It is required for a
                    `Domain` that is not a wildcard: the sidecar resolves the domain itself and
                    connects to this port, so the destination doesn't depend on the address the
                    client dials.
                  type: integer
                  format: int32
                protocol:
                  description: 'Protocol defines the communication protocol. Possible values: `tcp`, `tls`, `grpc`, `http`, `http2`, `mysql`.'
                  type: string
                  default: tcp
                  enum:
                    - tcp
                    - tls
                    - grpc
                    - http
                    - http2
                    - mysql
                type:
                  description: Type of the match, one of `Domain`, `IP` or `CIDR` is available.
                  type: string
                  enum:
                    - Domain
                    - IP
                    - CIDR
                value:
                  description: |-
                    Value for the specified Type. A wildcard `Domain`, for example
                    `*.example.com`, cannot be resolved by the sidecar, so its traffic goes to the
                    address the client dials and the match only restricts the SNI or Host.
                  type: string
              required:
                - type
                - value
              type: object
          passthroughMode:
            description: |-
              Defines the passthrough behavior. Possible values: `All`, `None`, `Matched`
              When `All` or `None` `appendMatch` has no effect.
              If not specified then the default value is "Matched".
            type: string
            enum:
              - All
              - Matched
              - None
      targetRef:
        description: |-
          TargetRef is a reference to the resource the policy takes an effect on.
          The resource could be either a real store object or virtual resource
          defined in-place.
        type: object
        properties:
          kind:
            description: Kind of the referenced resource
            type: string
            enum:
              - Mesh
              - Dataplane
          labels:
            description: |-
              Labels are used to select referenced real resources and to carry legacy
              service identity when a common TargetRef must still target old
              service-tag based paths.
            type: object
            additionalProperties:
              type: string
          sectionName:
            description: |-
              SectionName is used to target specific section of resource.
              For example, you can target port from MeshService.ports[] by its name. Only traffic to this port will be affected.
            type: string
        required:
          - kind
  creationTime:
    description: Time at which the resource was created
    type: string
    format: date-time
    example: 1901-01-01T00:00:00.000Z
    readOnly: true
  modificationTime:
    description: Time at which the resource was updated
    type: string
    format: date-time
    example: 1901-01-01T00:00:00.000Z
    readOnly: true
required:
  - type
  - name
  - spec
