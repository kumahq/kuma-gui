type: object
properties:
  creationTime:
    description: Time at which the resource was created
    type: string
    format: date-time
    readOnly: true
  kri:
    description: Kuma Resource Identifier (KRI) of the given resource
    type: string
    readOnly: true
  labels:
    type: object
    additionalProperties:
      type: string
  meshServices:
    description: |-
      Deprecated: ignored since 3.0, where every mesh behaves as Exclusive.
      Kept only so pre-3.0 zones keep receiving the mode over KDS.

      Deprecated: Marked as deprecated in api/mesh/v1alpha1/mesh.proto.
    type: object
    properties:
      mode:
        type: string
        enum:
          - Disabled
          - Everywhere
          - ReachableBackends
          - Exclusive
          - Disabled
          - Everywhere
          - ReachableBackends
          - Exclusive
  modificationTime:
    description: Time at which the resource was updated
    type: string
    format: date-time
    readOnly: true
  name:
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  type:
    type: string
required:
  - type
  - name

