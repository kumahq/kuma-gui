description: MeshOverview defines the projected state of a Mesh.
type: object
properties:
  mesh:
    type: object
    properties:
      meshServices:
        description: |-
          Deprecated: ignored since 3.0, where every mesh behaves as Exclusive.
          Kept only so pre-3.0 zones keep receiving the mode over KDS.

          Deprecated: Marked as deprecated in api/mesh/v1alpha1/mesh.proto.
        type: object
        properties:
          mode:
            type: string
            enum:
              - Disabled
              - Everywhere
              - ReachableBackends
              - Exclusive
  meshInsight:
    type: object
    properties:
      dataplanes:
        type: object
        properties:
          offline:
            type: integer
          online:
            type: integer
          partiallyDegraded:
            type: integer
          total:
            type: integer
      dpVersions:
        type: object
        properties:
          envoy:
            description: Dataplane stats grouped by Envoy version
            type: object
            additionalProperties:
              description: DataplaneStat defines statistic specifically for Dataplane
              properties:
                offline:
                  type: integer
                online:
                  type: integer
                partiallyDegraded:
                  type: integer
                total:
                  type: integer
              type: object
          kumaDp:
            description: Dataplane stats grouped by KumaDP version
            type: object
            additionalProperties:
              description: DataplaneStat defines statistic specifically for Dataplane
              properties:
                offline:
                  type: integer
                online:
                  type: integer
                partiallyDegraded:
                  type: integer
                total:
                  type: integer
              type: object
      mTLS:
        description: mTLS statistics
        type: object
        properties:
          issuedBackends:
            description: Dataplanes grouped by issued backends.
            type: object
            additionalProperties:
              description: DataplaneStat defines statistic specifically for Dataplane
              properties:
                offline:
                  type: integer
                online:
                  type: integer
                partiallyDegraded:
                  type: integer
                total:
                  type: integer
              type: object
          supportedBackends:
            description: Dataplanes grouped by supported backends.
            type: object
            additionalProperties:
              description: DataplaneStat defines statistic specifically for Dataplane
              properties:
                offline:
                  type: integer
                online:
                  type: integer
                partiallyDegraded:
                  type: integer
                total:
                  type: integer
              type: object
      resources:
        type: object
        additionalProperties:
          properties:
            total:
              type: integer
          type: object
