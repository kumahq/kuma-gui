type: object
properties:
  kri:
    type: string
  type:
    type: string
    enum:
      - ZoneIngress
      - ZoneEgress
  port:
    type: integer
    x-go-type: int32
  proxyResourceName:
    type: string
  clusters:
    description: The destinations this listener proxies traffic to, one entry per destination port.
    type: array
    items:
      $ref: 'DataplaneListenerCluster.yaml'
required:
  - kri
  - type
  - port
  - proxyResourceName
  - clusters
