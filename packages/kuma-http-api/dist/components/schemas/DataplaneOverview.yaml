description: DataplaneOverview defines the projected state of a Dataplane.
type: object
properties:
  dataplane:
    type: object
    properties:
      networking:
        description: |-
          Networking describes inbound and outbound interfaces of the data plane
          proxy.
        type: object
        properties:
          address:
            description: |-
              IP on which the data plane proxy is accessible to the control plane and
              other data plane proxies in the same network. This can also be a
              hostname, in which case the control plane will periodically resolve it.
            type: string
          admin:
            description: |-
              Admin describes configuration related to Envoy Admin API.
              Due to security, all the Envoy Admin endpoints are exposed only on
              localhost. Additionally, Envoy will expose `/ready` endpoint on
              `networking.address` for health checking systems to be able to check the
              state of Envoy. The rest of the endpoints exposed on `networking.address`
              are always protected by mTLS and only meant to be consumed internally by
              the control plane.
            type: object
            properties:
              port:
                description: Port on which Envoy Admin API server will be listening
                type: integer
          inbound:
            description: |-
              Inbound describes a list of inbound interfaces of the data plane proxy.

              Inbound describes a service implemented by the data plane proxy.
              All incoming traffic to a data plane proxy is going through inbound
              listeners. For every defined Inbound there is a corresponding Envoy
              Listener.
            type: array
            items:
              description: Inbound describes a service implemented by the data plane proxy.
              properties:
                address:
                  description: |-
                    Address on which inbound listener will be exposed.
                    Defaults to `networking.address`.
                  type: string
                health:
                  description: |-
                    Health describes the status of an inbound.
                    If 'health' is nil we consider data plane proxy as healthy.
                    Unhealthy data plane proxies are excluded from Endpoints Discovery
                    Service (EDS). On Kubernetes, it is filled automatically by the control
                    plane if Pod has readiness probe configured. On Universal, it can be
                    set by the external health checking system, but the most common way is
                    to use service probes.

                    See https://kuma.io/docs/latest/documentation/health for more
                    information.
                  type: object
                  properties:
                    ready:
                      description: |-
                        Ready indicates if the data plane proxy is ready to serve the
                        traffic.
                      type: boolean
                name:
                  description: Name adds another way of referencing this port, usable with MeshService
                  type: string
                port:
                  description: |-
                    Port of the inbound interface that will forward requests to the
                    service.

                    When transparent proxying is used, it is a port on which the service is
                    listening to. When transparent proxying is not used, Envoy will bind to
                    this port.
                  type: integer
                protocol:
                  description: Protocol of the service (tcp, http, grpc, etc).
                  type: string
                serviceAddress:
                  description: |-
                    Address of the service that requests will be forwarded to.
                    Defaults to 'inbound.address', since Kuma DP should be deployed next
                    to the service.
                  type: string
                servicePort:
                  description: |-
                    Port of the service that requests will be forwarded to.
                    Defaults to the same value as `port`.
                  type: integer
                serviceProbe:
                  description: |-
                    ServiceProbe defines parameters for probing the service next to
                    sidecar. When service probe is defined, Envoy will periodically health
                    check the application next to it and report the status to the control
                    plane. On Kubernetes, Kuma deployments rely on Kubernetes probes so
                    this is not used.

                    See https://kuma.io/docs/latest/documentation/health for more
                    information.
                  type: object
                  properties:
                    healthyThreshold:
                      description: |-
                        Number of consecutive healthy checks before considering a host
                        healthy.
                      type: integer
                      format: uint32
                    interval:
                      description: Interval between consecutive health checks.
                      type: object
                      properties:
                        nanos:
                          type: integer
                        seconds:
                          type: integer
                    tcp:
                      description: Tcp checker tries to establish tcp connection with destination
                      type: object
                      properties: {}
                    timeout:
                      description: Maximum time to wait for a health check response.
                      type: object
                      properties:
                        nanos:
                          type: integer
                        seconds:
                          type: integer
                    unhealthyThreshold:
                      description: |-
                        Number of consecutive unhealthy checks before considering a host
                        unhealthy.
                      type: integer
                      format: uint32
                state:
                  description: State describes the current state of the listener.
                  type: string
                  enum:
                    - Ready
                    - NotReady
                    - Ignored
              type: object
          listeners:
            description: |-
              Listeners describes zone proxy listeners embedded in this Dataplane.
              Listeners may coexist with inbounds.
            type: array
            items:
              description: Listener describes a zone proxy listener (ZoneIngress or ZoneEgress) embedded in a regular Dataplane.
              properties:
                address:
                  description: Address on which the listener will be exposed.
                  type: string
                name:
                  description: |-
                    Name uniquely identifies this listener within the Dataplane and is
                    used to reference it via sectionName in policies.
                    Optional: if unset, the port value is used as the name (as a string).
                  type: string
                port:
                  description: Port on which the listener will be exposed.
                  type: integer
                state:
                  description: |-
                    State describes the current health state of the listener.
                    The control plane sets this based on the readiness of the underlying
                    pod and sidecar container.
                  type: string
                  enum:
                    - Ready
                    - NotReady
                type:
                  description: |-
                    Type determines the role of this listener: ZoneIngress for inbound
                    cross-zone traffic or ZoneEgress for outbound external traffic.
                  type: string
                  enum:
                    - Unspecified
                    - ZoneIngress
                    - ZoneEgress
              type: object
          outbound:
            description: |-
              Outbound describes a list of services consumed by the data plane proxy.
              For every defined Outbound, there is a corresponding Envoy Listener.
            type: array
            items:
              description: Outbound describes a service consumed by the data plane proxy.
              properties:
                address:
                  description: |-
                    IP on which the consumed service will be available to this data plane
                    proxy. On Kubernetes, it's usually ClusterIP of a Service or PodIP of a
                    Headless Service. When left out, the control plane sets it to
                    127.0.0.1, so a Dataplane read back from the API always carries one.
                  type: string
                backendRef:
                  description: BackendRef is a way to target MeshService.
                  type: object
                  properties:
                    kind:
                      description: 'Kind is a type of the object to target. Allowed: MeshService'
                      type: string
                    labels:
                      description: |-
                        Labels to select a single object.
                        If no object is selected then outbound is not created.
                        If multiple objects are selected then the oldest one is used.
                      type: object
                      additionalProperties:
                        type: string
                    name:
                      description: Name of the targeted object
                      type: string
                    port:
                      description: Port of the targeted object. Required when kind is MeshService.
                      type: integer
                port:
                  description: |-
                    Port on which the consumed service will be available to this data plane
                    proxy. When transparent proxying is not used, Envoy will bind to this
                    port.
                  type: integer
              required:
                - address
              type: object
          transparentProxying:
            description: |-
              TransparentProxying describes the configuration for transparent proxying.
              It is used by default on Kubernetes.
            type: object
            properties:
              directAccessServices:
                description: |-
                  List of services that will be accessed directly via IP:PORT
                  Use `*` to indicate direct access to every service in the Mesh.
                  Using `*` to directly access every service is a resource-intensive
                  operation, use it only if needed.
                type: array
                items:
                  type: string
              reachableBackends:
                description: |-
                  Reachable backend via transparent proxy when running with
                  MeshExternalService, MeshService and MeshMultiZoneService. Setting an
                  explicit list of refs can dramatically improve the performance of the
                  mesh. If not specified, all services in the mesh are reachable.
                type: object
                properties:
                  refs:
                    type: array
                    items:
                      properties:
                        kind:
                          description: 'Type of the backend: MeshService, MeshExternalService or MeshMultiZoneService'
                          type: string
                        labels:
                          description: Labels used to select backends
                          type: object
                          additionalProperties:
                            type: string
                        name:
                          description: Name of the backend.
                          type: string
                        namespace:
                          description: Namespace of the backend. Might be empty
                          type: string
                        port:
                          description: Port of the backend.
                          type: integer
                          format: uint32
                      required:
                        - kind
                      type: object
  dataplaneInsight:
    type: object
    properties:
      mTLS:
        description: Insights about mTLS for Dataplane.
        type: object
        properties:
          certificateExpirationTime:
            description: |-
              Expiration time of the last certificate that was generated for a
              Dataplane.
            type: string
            format: date-time
          certificateRegenerations:
            description: Number of certificate regenerations for a Dataplane.
            type: integer
          issuedBackend:
            description: Backend that was used to generate current certificate
            type: string
          lastCertificateRegeneration:
            description: Time on which the last certificate was generated.
            type: string
            format: date-time
          supportedBackends:
            description: Supported backends (CA).
            type: array
            items:
              type: string
      metadata:
        type: object
        properties: {}
      openTelemetry:
        description: Insights about OTel runtime resolution for this Dataplane.
        type: object
        properties:
          backends:
            type: array
            items:
              properties:
                logs:
                  type: object
                  properties:
                    blockedReasons:
                      type: array
                      items:
                        type: string
                    enabled:
                      type: boolean
                    envAllowed:
                      type: boolean
                    envInputPresent:
                      type: boolean
                    missingFields:
                      type: array
                      items:
                        type: string
                    overrideKinds:
                      type: array
                      items:
                        type: string
                    state:
                      type: string
                metrics:
                  type: object
                  properties:
                    blockedReasons:
                      type: array
                      items:
                        type: string
                    enabled:
                      type: boolean
                    envAllowed:
                      type: boolean
                    envInputPresent:
                      type: boolean
                    missingFields:
                      type: array
                      items:
                        type: string
                    overrideKinds:
                      type: array
                      items:
                        type: string
                    state:
                      type: string
                name:
                  type: string
                traces:
                  type: object
                  properties:
                    blockedReasons:
                      type: array
                      items:
                        type: string
                    enabled:
                      type: boolean
                    envAllowed:
                      type: boolean
                    envInputPresent:
                      type: boolean
                    missingFields:
                      type: array
                      items:
                        type: string
                    overrideKinds:
                      type: array
                      items:
                        type: string
                    state:
                      type: string
              type: object
      subscriptions:
        description: List of ADS subscriptions created by a given Dataplane.
        type: array
        items:
          description: DiscoverySubscription describes a single ADS subscription created by a Dataplane to the Control Plane.
          properties:
            connectTime:
              description: Time when a given Dataplane connected to the Control Plane.
              type: string
              format: date-time
            controlPlaneInstanceId:
              description: Control Plane instance that handled given subscription.
              type: string
            disconnectTime:
              description: Time when a given Dataplane disconnected from the Control Plane.
              type: string
              format: date-time
            generation:
              description: |-
                Generation is an integer number which is periodically increased by the
                status sink
              type: integer
            id:
              description: Unique id per ADS subscription.
              type: string
            status:
              description: Status of the ADS subscription.
              type: object
              properties:
                cds:
                  description: CDS defines all CDS stats.
                  type: object
                  properties:
                    responsesAcknowledged:
                      description: Number of xDS responses ACKed by the Dataplane.
                      type: integer
                    responsesRejected:
                      description: Number of xDS responses NACKed by the Dataplane.
                      type: integer
                    responsesSent:
                      description: Number of xDS responses sent to the Dataplane.
                      type: integer
                eds:
                  description: EDS defines all EDS stats.
                  type: object
                  properties:
                    responsesAcknowledged:
                      description: Number of xDS responses ACKed by the Dataplane.
                      type: integer
                    responsesRejected:
                      description: Number of xDS responses NACKed by the Dataplane.
                      type: integer
                    responsesSent:
                      description: Number of xDS responses sent to the Dataplane.
                      type: integer
                lastUpdateTime:
                  description: Time when status of a given ADS subscription was most recently updated.
                  type: string
                  format: date-time
                lds:
                  description: LDS defines all LDS stats.
                  type: object
                  properties:
                    responsesAcknowledged:
                      description: Number of xDS responses ACKed by the Dataplane.
                      type: integer
                    responsesRejected:
                      description: Number of xDS responses NACKed by the Dataplane.
                      type: integer
                    responsesSent:
                      description: Number of xDS responses sent to the Dataplane.
                      type: integer
                rds:
                  description: RDS defines all RDS stats.
                  type: object
                  properties:
                    responsesAcknowledged:
                      description: Number of xDS responses ACKed by the Dataplane.
                      type: integer
                    responsesRejected:
                      description: Number of xDS responses NACKed by the Dataplane.
                      type: integer
                    responsesSent:
                      description: Number of xDS responses sent to the Dataplane.
                      type: integer
                total:
                  description: Total defines an aggregate over individual xDS stats.
                  type: object
                  properties:
                    responsesAcknowledged:
                      description: Number of xDS responses ACKed by the Dataplane.
                      type: integer
                    responsesRejected:
                      description: Number of xDS responses NACKed by the Dataplane.
                      type: integer
                    responsesSent:
                      description: Number of xDS responses sent to the Dataplane.
                      type: integer
            version:
              description: Version of Envoy and Kuma dataplane
              type: object
              properties:
                dependencies:
                  description: Versions of other dependencies
                  type: object
                  additionalProperties:
                    type: string
                envoy:
                  description: Version of Envoy
                  type: object
                  properties:
                    build:
                      description: Full build tag of Envoy version
                      type: string
                    kumaDpCompatible:
                      description: True iff Envoy version is compatible with Kuma DP version
                      type: boolean
                    version:
                      description: Version number of Envoy
                      type: string
                kumaDp:
                  description: Version of Kuma Dataplane
                  type: object
                  properties:
                    buildDate:
                      description: Build date of Kuma Dataplane version
                      type: string
                    gitCommit:
                      description: Git commit of Kuma Dataplane version
                      type: string
                    gitTag:
                      description: Git tag of Kuma Dataplane version
                      type: string
                    kumaCpCompatible:
                      description: True iff Kuma DP version is compatible with Kuma CP version
                      type: boolean
                    version:
                      description: Version number of Kuma Dataplane
                      type: string
          type: object
