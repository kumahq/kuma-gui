description: A response containing a list of zone overviews.
content:
  application/json:
    schema:
      type: object
      properties:
        total:
          type: integer
          example: 200
        next:
          description: URL to the next page, or null when this is the last page
          type:
            - string
            - 'null'
        items:
          type: array
          items:
            $ref: '../schemas/ZoneOverviewWithMeta.yaml'
      required:
        - total
        - items
        - next
