description: List
content:
  application/json:
    schema:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '../schemas/GlobalSecretItem.yaml'
        total:
          description: The total number of entities
          type: number
        next:
          description: URL to the next page, or null when this is the last page
          type:
            - string
            - 'null'
      required:
        - total
        - items
        - next
