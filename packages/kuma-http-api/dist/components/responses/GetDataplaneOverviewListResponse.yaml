description: A response containing the overview of a dataplane.
content:
  application/json:
    schema:
      type: object
      properties:
        total:
          type: integer
          example: 200
        next:
          description: URL to the next page, or null when this is the last page
          type:
            - string
            - 'null'
        items:
          type: array
          items:
            $ref: '../schemas/DataplaneOverviewWithMeta.yaml'
      required:
        - total
        - items
        - next
